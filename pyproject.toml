[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medenroll834"
version = "0.1.0"
description = "X12 834 EDI enrollment pipeline (PySpark / Delta Lake medallion architecture)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyspark>=4.0.0",
    "delta-spark>=4.0.0",
    "pyyaml>=6.0.1",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
orchestration = ["apache-airflow>=2.9.0"]
db = ["psycopg2-binary>=2.9.9"]
quality = ["great-expectations>=0.18.0"]
databricks = ["databricks-sdk>=0.20.0"]

[project.scripts]
medenroll834-generate = "generator.synthetic_834_generator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["02_tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "02_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

